name: Feature request
description: Propose a change to the protocol, the SDK or the tooling.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What a contributor, organizer, seller or integrator cannot do today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The instructions, accounts or SDK functions it would add or change.
    validations:
      required: true
  - type: textarea
    id: invariants
    attributes:
      label: Effect on invariants
      description: How the change interacts with the invariants in docs/security-model.md and the append-only account layout.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
